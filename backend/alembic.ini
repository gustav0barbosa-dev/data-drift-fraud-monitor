# ============================================================
# Alembic - Data Drift Fraud Monitor
# ============================================================
# A URL de conexão é resolvida em db/migrations/env.py a partir de
# DATABASE_URL (mesma variável usada pela API). O valor abaixo é apenas
# um fallback para execução manual.
[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql://admin:admin123@localhost:5432/drift_monitor

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
